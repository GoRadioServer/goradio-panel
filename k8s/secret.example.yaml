# Template only -- copy to secret.yaml, fill in real values, and DO NOT
# commit the filled-in version (secret.yaml is gitignored for exactly
# this reason). Apply with: kubectl apply -f k8s/secret.yaml
#
# Equivalently, without ever writing secrets to disk:
#   kubectl create secret generic goradio-panel-secrets \
#     --namespace goradio-panel \
#     --from-literal=GORADIO_JWT_SECRET='...' \
#     --from-literal=PANEL_SESSION_JWT_SECRET='...' \
#     --from-literal=PANEL_BOOTSTRAP_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: goradio-panel-secrets
  namespace: goradio-panel
type: Opaque
stringData:
  # Must match the audio server's own auth.jwt_secret exactly -- the
  # panel signs its admin gRPC token with this.
  GORADIO_JWT_SECRET: "CHANGE_ME"

  # A separate secret for the panel's own session JWTs (human logins).
  # Never reuse GORADIO_JWT_SECRET here -- different trust boundary.
  PANEL_SESSION_JWT_SECRET: "CHANGE_ME"

  # Only used to create the bootstrap admin account on first startup
  # (when the users table is empty). Safe to leave set after that --
  # it's a no-op once an account exists. Rotate it out of the secret
  # once you've logged in and set a real password from the Users page,
  # if you'd rather it not sit here long-term.
  PANEL_BOOTSTRAP_PASSWORD: "CHANGE_ME"
